<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fondo hexagonal — mismo gris que --color-background/--color-divider del sistema. -->
  <path
    d="M72 14 L128 14 L186 62 L186 138 L128 186 L72 186 L14 138 L14 62 Z"
    fill="#EDEDED"
  />

  <!-- Antenas — nacen cerca del cuello, antes del cuerpo para que este las tape en la base. -->
  <path d="M115 50 C 112 38, 106 30, 98 25" fill="none" stroke="#FFB213" stroke-width="5" stroke-linecap="round" />
  <circle cx="96" cy="22" r="6.5" fill="#FFB213" />
  <path d="M126 58 C 130 46, 138 38, 148 33" fill="none" stroke="#FFB213" stroke-width="5" stroke-linecap="round" />
  <circle cx="151" cy="30" r="6.5" fill="#FFB213" />

  <!-- Aguijón/cola — pequeño, apenas asoma en la base. -->
  <path d="M112 172 L 128 176 L 118 186 Z" fill="#22201C" />

  <!-- Cuerpo — lóbulo grande arriba-izquierda, un cuello cóncavo marca dónde
       nacen las antenas, después se ensancha de nuevo hacia la cola. -->
  <path
    d="M96 30
       C 62 26, 34 54, 34 92
       C 34 122, 44 148, 62 162
       C 80 176, 108 180, 128 168
       C 144 158, 152 138, 148 116
       C 146 100, 140 82, 122 62
       C 114 52, 104 40, 96 30 Z"
    fill="#FFB213"
  />

  <!-- Rayas — banda clara + dos rayas oscuras, siguiendo la curva inferior del cuerpo. -->
  <path
    d="M35 114 C 66 130, 116 133, 149 121 L 147 137 C 112 149, 64 146, 36 130 Z"
    fill="#FFCB66"
  />
  <path
    d="M34 106 C 66 122, 118 126, 150 113 L 150 121 C 117 134, 65 130, 35 114 Z"
    fill="#22201C"
  />
  <path
    d="M39 138 C 71 152, 112 155, 141 144 L 137 158 C 106 169, 66 166, 40 152 Z"
    fill="#22201C"
  />

  <!-- Ojos y sonrisa -->
  <circle cx="70" cy="98" r="7" fill="#22201C" />
  <circle cx="98" cy="98" r="7" fill="#22201C" />
  <path d="M76 112 C 81 118, 89 118, 94 112" fill="none" stroke="#22201C" stroke-width="5" stroke-linecap="round" />
</svg>
